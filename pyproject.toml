[project]
name = "projecto-programacao-web"
version = "0.1.0"
description = "Portfolio academico em Django preparado para deploy na Vercel."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django==4.2.30",
    "Pillow==11.3.0",
    "cloudinary>=1.41,<2",
    "dj-database-url>=2.3,<3",
    "django-cloudinary-storage>=0.3,<0.4",
    "django-environ>=0.11,<0.12",
    "psycopg2-binary>=2.9,<3",
    "requests==2.32.5",
    "whitenoise>=6.7,<7",
]

[tool.vercel.scripts]
build = "python manage.py migrate && python manage.py seed_portfolio && python manage.py ensure_superuser && python manage.py ensure_portfolio_manager && python manage.py collectstatic --noinput"
