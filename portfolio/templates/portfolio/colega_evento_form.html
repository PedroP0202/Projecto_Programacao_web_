{% extends 'portfolio/base.html' %}

{% block title %}Editar Evento #{{ evento_id }} – Paintball Events{% endblock %}

{% block content %}
<div class="actions">
  <a class="button secondary" href="{% url 'colega_evento_detalhe' evento_id %}">← Voltar</a>
</div>

{% if erro %}
<section style="border-left:4px solid #b91c1c;">
  <strong>⚠️ Erro ao carregar dados:</strong> {{ erro }}
</section>
{% endif %}

<section>
  <h1>✏️ Editar Evento</h1>
  <form method="post" id="editar-evento-form">
    {% csrf_token %}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px;">
      <div>
        <label for="edit-name">Nome *</label>
        <input id="edit-name" name="name" type="text" required value="{{ dados.name|default:'' }}">
      </div>
      <div>
        <label for="edit-date">Data *</label>
        <input id="edit-date" name="date" type="date" required value="{{ dados.date|default:'' }}">
      </div>
      <div>
        <label for="edit-location">Localização *</label>
        <input id="edit-location" name="location" type="text" required value="{{ dados.location|default:'' }}">
      </div>
      <div>
        <label for="edit-price">Preço (€) *</label>
        <input id="edit-price" name="price" type="number" step="0.01" min="0" required value="{{ dados.price|default:'0' }}">
      </div>
      <div style="grid-column:1/-1;">
        <label for="edit-description">Descrição</label>
        <textarea id="edit-description" name="description" rows="3">{{ dados.description|default:'' }}</textarea>
      </div>
    </div>
    <button type="submit">💾 Guardar Alterações</button>
  </form>
</section>
{% endblock %}
