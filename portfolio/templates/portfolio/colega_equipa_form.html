{% extends 'portfolio/base.html' %}
{% block title %}Editar Equipa #{{ equipa_id }}{% endblock %}
{% block content %}
<div class="actions">
  <a class="button secondary" href="{% url 'colega_equipas_lista' %}">← Voltar</a>
</div>
<section>
  <h1>✏️ Editar Equipa</h1>
  <form method="post">
    {% csrf_token %}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px;">
      <div>
        <label for="ee-name">Nome *</label>
        <input id="ee-name" name="name" type="text" required value="{{ dados.name|default:'' }}">
      </div>
      <div>
        <label for="ee-color">Cor *</label>
        <input id="ee-color" name="color" type="text" required value="{{ dados.color|default:'' }}">
      </div>
    </div>
    <button type="submit">💾 Guardar</button>
  </form>
</section>
{% endblock %}
